# 配置ディレクトリが変わっても既存のDBボリュームを引き継ぐ。
name: hanaprime

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      TZ: Asia/Tokyo
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-diary}
      DB_USERNAME: ${DB_USERNAME:-diary}
      DB_PASSWORD: ${DB_PASSWORD:-local_diary_password}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:26.7.0
    environment:
      TZ: Asia/Tokyo
      MYSQL_DATABASE: ${DB_DATABASE:-diary}
      MYSQL_USER: ${DB_USERNAME:-diary}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_diary_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
